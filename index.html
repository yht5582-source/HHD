<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>居家血液透析(HHD)處方決策與 stdKt/V 試算模型</title>
    <style>
        :root {
            --primary: #0f766e;
            --secondary: #0d9488;
            --success: #16a34a;
            --warning: #d97706;
            --danger: #dc2626;
            --info: #2563eb;
            --bg: #f0fdfa;
            --card-bg: #ffffff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg);
            color: #334155;
            line-height: 1.6;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 950px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: var(--primary);
            border-bottom: 3px solid var(--secondary);
            padding-bottom: 12px;
            margin-bottom: 30px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
        }
        .card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }
        h3 {
            margin-top: 0;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #475569;
        }
        label small {
            color: #64748b;
            font-weight: normal;
        }
        input[type="number"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
            transition: border-color 0.2s;
        }
        input[type="number"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.2);
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background-color 0.2s;
            margin-top: 10px;
        }
        button:hover { background-color: #115e59; }
        .result-section {
            display: none;
            border-top: 5px solid var(--secondary);
        }
        .alert {
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
        }
        .alert-success { background-color: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .alert-warning { background-color: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
        .alert-danger { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        .alert-info { background-color: #dbeafe; color: #1e3a8a; border: 1px solid #bfdbfe; font-size: 0.9em; margin-bottom: 15px;}
        .data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed #e2e8f0;
            padding: 12px 0;
        }
        .data-row:last-child { border-bottom: none; }
        .highlight { color: var(--primary); font-weight: bold; font-size: 1.15em; }
        .badge {
            font-size: 0.85em;
            padding: 4px 8px;
            border-radius: 999px;
            background: #e2e8f0;
            color: #475569;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>居家血液透析 (HHD) 動態處方優化與 stdKt/V 決策</h1>
    
    <div class="grid">
        <!-- 參數輸入區 -->
        <div class="card">
            <h3>📝 臨床生理參數</h3>
            <div class="form-group">
                <label>現在體重 (Current Weight) <small>kg</small></label>
                <input type="number" id="currentWt" value="75.5" step="0.1">
            </div>
            <div class="form-group">
                <label>乾體重 (Dry Weight) <small>kg</small></label>
                <input type="number" id="dryWt" value="72.0" step="0.1">
            </div>
            <div class="form-group">
                <label>目前肌酸酐 (Serum Cr) <small>mg/dL</small></label>
                <input type="number" id="cr" value="11.2" step="0.1">
            </div>
            <div class="form-group">
                <label>血磷 (Phosphate) <small>mg/dL</small></label>
                <input type="number" id="phos" value="5.8" step="0.1">
            </div>
            <div class="form-group">
                <label>殘餘尿量 (Residual Urine) <small>mL/day</small></label>
                <input type="number" id="urine" value="150" step="50">
            </div>
            <button onclick="calculatePrescription()">生成最佳化處方</button>
        </div>

        <!-- 決策結果區 -->
        <div class="card result-section" id="resultCard">
            <h3>📊 處方建議與清除率指標</h3>
            
            <div id="alertBox" class="alert"></div>
            <div id="optimizationAlert" class="alert-info" style="display: none;"></div>

            <div class="data-row">
                <span>系統推薦模式:</span>
                <span class="highlight" id="resMode"></span>
            </div>
            <div class="data-row">
                <span>預估單次脫水量 (UF):</span>
                <span class="highlight"><span id="resUf"></span> L</span>
            </div>
            <div class="data-row" style="background: #e0f2fe; padding: 12px; border-radius: 6px;">
                <span style="color: var(--info); font-weight: bold;">優化後處方 (頻率/時數):</span>
                <span id="resFreqTime" style="font-weight: 900; color: var(--info); font-size: 1.2em;"></span>
            </div>
            <div class="data-row">
                <span>流速設定 (Qb / Qd):</span>
                <span id="resFlows"></span>
            </div>
            
            <h4 style="margin-top: 24px; color: #334155; padding-bottom: 8px; border-bottom: 2px solid #e2e8f0;">🫀 安全與 Kt/V 動力學</h4>
            
            <div class="data-row">
                <span>超濾率 (UFR):</span>
                <div>
                    <span id="resUfr" style="font-weight: bold; font-size: 1.1em;"></span>
                    <span id="resUfrBadge" class="badge"></span>
                </div>
            </div>
            <div class="data-row">
                <span>單次 spKt/V 估算:</span>
                <span id="resSpKtV"></span>
            </div>
            <div class="data-row" style="background: #f8fafc; padding: 12px; border-radius: 6px; margin-top: 8px; border-left: 4px solid var(--success);">
                <span style="font-weight: 600; color: var(--success);">預期 stdKt/V (達標 ≥ 2.3):</span>
                <span class="highlight" id="resStdKtV" style="font-size: 1.3em; color: var(--success);"></span>
            </div>
        </div>
    </div>
</div>

<script>
    // 計算 stdKt/V 的核心模組
    function calculateKinetics(estK_mL_min, hours, freq, volume_V_mL) {
        const time_mins = hours * 60;
        const spKtV = (estK_mL_min * time_mins) / volume_V_mL;
        // Daugirdas eKt/V
        const eKtV = spKtV - (0.6 * (spKtV / hours)) + 0.03;
        // Leypoldt stdKt/V
        const stdKtV = (168 * (1 - Math.exp(-eKtV))) / (hours + (168 / (freq * (eKtV / hours))));
        
        return { spKtV, eKtV, stdKtV };
    }

    function calculatePrescription() {
        const currentWt = parseFloat(document.getElementById('currentWt').value);
        const dryWt = parseFloat(document.getElementById('dryWt').value);
        const cr = parseFloat(document.getElementById('cr').value);
        const phos = parseFloat(document.getElementById('phos').value);
        const urine = parseFloat(document.getElementById('urine').value);

        if (currentWt <= dryWt) {
            alert("錯誤：現在體重必須大於乾體重。");
            return;
        }

        const ufVolume_L = currentWt - dryWt;
        const ufVolume_mL = ufVolume_L * 1000;
        const volume_V_L = dryWt * 0.55;
        const volume_V_mL = volume_V_L * 1000;

        let mode, freq, hours, qb, qd, estK_mL_min;
        let isOptimized = false;
        let baselineMsg = "";

        // 基準決策邏輯
        if (phos >= 6.0 || ufVolume_L >= 3.0 || (cr >= 10.0 && urine <= 200)) {
            mode = "夜間長時透析 (Nocturnal HHD)";
            freq = 4;        
            hours = 7.0;     
            qb = 220;        
            qd = 300; 
            estK_mL_min = 155; 
        } else {
            mode = "短時間每日透析 (Short Daily HHD)";
            freq = 5;        
            hours = 2.5;     
            qb = 350;        
            qd = 400; 
            estK_mL_min = 230; 
        }

        // 動態處方優化 (Auto-escalation to meet stdKt/V >= 2.3)
        let kinetics = calculateKinetics(estK_mL_min, hours, freq, volume_V_mL);
        
        if (kinetics.stdKtV < 2.3) {
            isOptimized = true;
            baselineMsg = `基準處方 (每週 ${freq} 次 / 每次 ${hours} 小時) 的 stdKt/V 僅 ${kinetics.stdKtV.toFixed(2)}，未達 FHN 標準，系統已啟動處方升級。`;
            
            if (mode.includes("Short Daily")) {
                // SDHHD 升級路徑：先拉長時數 (最高3.5h)，再增加天數 (最高6天)
                while (kinetics.stdKtV < 2.3 && (hours < 3.5 || freq < 6)) {
                    if (hours < 3.5) {
                        hours += 0.5;
                    } else if (freq < 6) {
                        freq += 1;
                    }
                    kinetics = calculateKinetics(estK_mL_min, hours, freq, volume_V_mL);
                }
            } else {
                // NHHD 升級路徑：先增加天數(最高5晚)，再拉長時數(最高8h)，極端再加至6晚
                while (kinetics.stdKtV < 2.3 && (freq < 6 || hours < 8)) {
                    if (freq < 5) {
                        freq += 1;
                    } else if (hours < 8) {
                        hours += 0.5;
                    } else if (freq < 6) {
                        freq += 1;
                    }
                    kinetics = calculateKinetics(estK_mL_min, hours, freq, volume_V_mL);
                }
            }
        }

        // UFR 計算 (需使用優化後最終的 hours)
        const ufr = ufVolume_mL / (dryWt * hours);
        let ufrBadge = "", alertClass = "", alertMsg = "";

        if (ufr <= 10) {
            ufrBadge = "🟢 最佳安全區";
            alertClass = "alert-success";
            alertMsg = "心血管負荷極低，脫水速率與透析處方安全。";
        } else if (ufr <= 13) {
            ufrBadge = "🟡 臨界監測區";
            alertClass = "alert-warning";
            alertMsg = "UFR 介於 10-13 mL/kg/hr，尚在可接受範圍，請注意血壓。";
        } else {
            ufrBadge = "🔴 危險區域";
            alertClass = "alert-danger";
            alertMsg = `⚠️ 警告：脫水速率 (${ufr.toFixed(1)} mL/kg/hr) 過快！有誘發心肌頓抑風險。`;
        }

        // UI 渲染
        document.getElementById('resultCard').style.display = 'block';
        
        const alertBox = document.getElementById('alertBox');
        alertBox.className = "alert " + alertClass;
        alertBox.innerHTML = alertMsg;

        const optAlert = document.getElementById('optimizationAlert');
        if (isOptimized) {
            optAlert.style.display = "block";
            optAlert.innerHTML = `💡 <b>處方自動升級機制啟動</b>：<br>${baselineMsg}`;
        } else {
            optAlert.style.display = "none";
        }

        document.getElementById('resMode').innerText = mode;
        document.getElementById('resUf').innerText = ufVolume_L.toFixed(1);
        document.getElementById('resFreqTime').innerText = `每週 ${freq} 次 / 每次 ${hours} 小時`;
        document.getElementById('resFlows').innerText = `Qb: ${qb} mL/min | Qd: ${qd} mL/min`;
        
        const ufrEl = document.getElementById('resUfr');
        ufrEl.innerText = `${ufr.toFixed(1)} mL/kg/hr`;
        ufrEl.style.color = ufr > 13 ? "var(--danger)" : (ufr > 10 ? "var(--warning)" : "var(--success)");
        document.getElementById('resUfrBadge').innerText = ufrBadge;

        document.getElementById('resSpKtV').innerText = kinetics.spKtV.toFixed(2);
        
        const stdKtVEl = document.getElementById('resStdKtV');
        stdKtVEl.innerText = kinetics.stdKtV.toFixed(2);
        
        // 極端體重或脫水情況可能導致升級到極限仍未達 2.3
        if (kinetics.stdKtV < 2.3) {
            stdKtVEl.innerText += " (已達參數上限，仍未達理想值 2.3，建議重新評估通路血流速)";
            stdKtVEl.style.color = "var(--danger)";
        }
    }
</script>

</body>
</html>
