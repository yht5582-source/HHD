<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>居家血液透析(HHD)處方與 Kt/V 決策評估系統</title>
    <style>
        :root {
            --primary: #2563eb;
            --success: #16a34a;
            --warning: #ca8a04;
            --danger: #dc2626;
            --bg: #f8fafc;
            --card-bg: #ffffff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: #333;
            line-height: 1.6;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
            padding-bottom: 10px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
        }
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #475569;
        }
        input[type="number"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        button:hover { background-color: #1d4ed8; }
        .result-section {
            display: none;
            border-left: 5px solid var(--success);
        }
        .alert {
            padding: 15px;
            border-radius: 4px;
            margin-top: 15px;
            font-weight: bold;
        }
        .alert-success { background-color: #dcfce7; color: #166534; }
        .alert-warning { background-color: #fef08a; color: #854d0e; }
        .alert-danger { background-color: #fee2e2; color: #991b1b; }
        .data-row {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #eee;
            padding: 8px 0;
        }
        .highlight { color: var(--primary); font-weight: bold; font-size: 1.1em; }
    </style>
</head>
<body>

<div class="container">
    <h1>居家血液透析 (HHD) 決策輔助與 Kt/V 試算</h1>
    
    <div class="grid">
        <!-- 輸入區 -->
        <div class="card">
            <h3>📝 病患臨床參數</h3>
            
            <div class="form-group">
                <label>現在體重 (Current Weight, kg)</label>
                <input type="number" id="currentWt" value="68" step="0.1">
            </div>
            <div class="form-group">
                <label>乾體重 (Dry Weight, kg) <small>目標體重</small></label>
                <input type="number" id="dryWt" value="65" step="0.1">
            </div>
            <div class="form-group">
                <label>目前肌酸酐 (Serum Cr, mg/dL)</label>
                <input type="number" id="cr" value="9.5" step="0.1">
            </div>
            <div class="form-group">
                <label>血磷 (Phosphate, mg/dL)</label>
                <input type="number" id="phos" value="6.5" step="0.1">
            </div>
            <div class="form-group">
                <label>殘餘尿量 (Residual Urine, mL/day)</label>
                <input type="number" id="urine" value="200" step="100">
            </div>
            <button onclick="calculatePrescription()">生成透析處方與評估</button>
        </div>

        <!-- 結果區 -->
        <div class="card result-section" id="resultCard">
            <h3>📊 系統推薦處方與動力學 (Kt/V)</h3>
            
            <div id="alertBox" class="alert"></div>

            <div class="data-row">
                <span>推薦模式:</span>
                <span class="highlight" id="resMode"></span>
            </div>
            <div class="data-row">
                <span>目標脫水量 (UF):</span>
                <span class="highlight"><span id="resUf"></span> L</span>
            </div>
            <div class="data-row">
                <span>處方頻率與時間:</span>
                <span id="resFreqTime"></span>
            </div>
            <div class="data-row">
                <span>血流速 (Qb) / 透析液流速 (Qd):</span>
                <span id="resFlows"></span>
            </div>
            
            <h4 style="margin-top: 20px; color: #475569; border-bottom: 1px solid #ccc;">🫀 安全與效能指標</h4>
            <div class="data-row">
                <span>超濾率 (UFR):</span>
                <span id="resUfr" style="font-weight: bold;"></span>
            </div>
            <div class="data-row">
                <span>單次 Kt/V 估算:</span>
                <span class="highlight" id="resKtV"></span>
            </div>
            <div class="data-row">
                <span>每週總 Kt/V:</span>
                <span class="highlight" id="resWeeklyKtV"></span>
            </div>
        </div>
    </div>
</div>

<script>
    function calculatePrescription() {
        // 取得輸入值
        const currentWt = parseFloat(document.getElementById('currentWt').value);
        const dryWt = parseFloat(document.getElementById('dryWt').value);
        const cr = parseFloat(document.getElementById('cr').value);
        const phos = parseFloat(document.getElementById('phos').value);
        const urine = parseFloat(document.getElementById('urine').value);

        // 防呆
        if (currentWt <= dryWt) {
            alert("現在體重必須大於乾體重，請確認輸入數值！");
            return;
        }

        // 基本計算
        const ufVolume_L = currentWt - dryWt;
        const ufVolume_mL = ufVolume_L * 1000;
        
        // 估算體積 (V) - 使用 Watson formula 簡化版 (佔乾體重 55%)
        const volume_V_mL = dryWt * 0.55 * 1000;

        let mode, freq, hours, qb, qd, estK;

        // 核心決策邏輯：根據磷、尿量與預期脫水決定模式
        if (phos > 6.0 || ufVolume_L > 3.0 || (cr > 10 && urine < 100)) {
            // 磷高、需水量大、或完全無尿且毒素高 -> 推薦夜間長時透析 (NHHD)
            mode = "夜間長時透析 (Nocturnal HHD)";
            freq = 4; // 每週 4 次
            hours = 7; // 每次 7 小時
            qb = 250; // 低血流速策安全
            qd = 300; 
            estK = 160; // 在低血流速下的 clearance 估算
        } else {
            // 短時間每日透析 (SDHHD)
            mode = "短時間每日透析 (Short Daily HHD)";
            freq = 5; // 每週 5 次
            hours = 2.5; // 每次 2.5 小時
            qb = 350; 
            qd = 400; // 或 NxStage 容積模式
            estK = 220; // 在較高血流速下的 clearance 估算
        }

        // 計算 UFR (mL/kg/hr) 基準為乾體重
        const ufr = ufVolume_mL / (dryWt * hours);
        let ufrStatus = "";
        let alertClass = "";
        let alertMsg = "";

        if (ufr <= 10) {
            ufrStatus = "🟢 安全 (≤ 10 mL/kg/hr)";
            alertClass = "alert-success";
            alertMsg = "心血管負荷極低，透析處方安全。";
        } else if (ufr <= 13) {
            ufrStatus = "🟡 臨界警示 (10-13 mL/kg/hr)";
            alertClass = "alert-warning";
            alertMsg = "脫水速率尚可接受，但需監測血壓變化。";
        } else {
            ufrStatus = "🔴 危險 (> 13 mL/kg/hr)";
            alertClass = "alert-danger";
            alertMsg = "⚠️ 警告：脫水速率過快！有誘發心肌頓抑(Stunning)風險，建議增加透析時間或頻率。";
        }

        // 計算 Kt/V = (K * t) / V
        const time_mins = hours * 60;
        const singleKtV = (estK * time_mins) / volume_V_mL;
        const weeklyKtV = singleKtV * freq;

        // 渲染結果
        document.getElementById('resultCard').style.display = 'block';
        
        const alertBox = document.getElementById('alertBox');
        alertBox.className = "alert " + alertClass;
        alertBox.innerHTML = alertMsg;

        document.getElementById('resMode').innerText = mode;
        document.getElementById('resUf').innerText = ufVolume_L.toFixed(1);
        document.getElementById('resFreqTime').innerText = `每週 ${freq} 次，每次 ${hours} 小時`;
        document.getElementById('resFlows').innerText = `Qb: ${qb} mL/min | Qd: ${qd} mL/min`;
        
        const ufrEl = document.getElementById('resUfr');
        ufrEl.innerText = `${ufr.toFixed(1)} (${ufrStatus})`;
        ufrEl.style.color = ufr > 13 ? "red" : (ufr > 10 ? "#ca8a04" : "green");

        document.getElementById('resKtV').innerText = singleKtV.toFixed(2);
        
        const wkKtvEl = document.getElementById('resWeeklyKtV');
        wkKtvEl.innerText = weeklyKtV.toFixed(2);
        if(mode.includes("Short") && weeklyKtV < 2.1) {
             wkKtvEl.innerText += " ⚠️ (未達每日透析建議指標)";
             wkKtvEl.style.color = "red";
        } else {
             wkKtvEl.style.color = "inherit";
        }
    }
</script>

</body>
</html>
